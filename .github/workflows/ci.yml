name: CI

on:
  push:
  pull_request:

jobs:
  backend-checks:
    name: Backend checks (tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi python-multipart httpx

      - name: Run unit tests (unittest)
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  web-checks:
    name: Web checks (lint/build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build

