version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: speech-engine-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://backend:8000"
    container_name: speech-engine-web
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

